# Docker Compose – Maktab Platform
# =================================
# docker compose up -d --build

services:
  # ─── PostgreSQL Database ───
  db:
    image: postgres:16-alpine
    container_name: maktab-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-maktabdb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - maktab

  # ─── Backend (Spring Boot) ───
  backend:
    container_name: maktab-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-maktabdb}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 10MB
      BACKEND_PUBLIC_URL: https://maktab.ecos.uz
      BOT_WEBHOOK_URL: http://bot:5000
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - maktab

  # ─── Frontend (ikkalasi ham: "/" oddiy foydalanuvchilar, "/spd" superadmin) ───
  frontend:
    container_name: maktab-frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - maktab


  # ─── Telegram bot (@maktab_davomad_bot) — ota-onalarga xabar yuborish ───
  bot:
    container_name: maktab-bot
    build:
      context: ./bot
      dockerfile: Dockerfile
    restart: always
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BACKEND_URL: http://backend:8080
      PORT: 5000
    depends_on:
      - backend
    networks:
      - maktab

  # ─── Cloudflare Tunnel ───
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: maktab-tunnel
    restart: always
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    networks:
      - maktab

networks:
  maktab:
    driver: bridge

volumes:
  pgdata:
  uploads:
