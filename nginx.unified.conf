server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Superadmin panel (frontend A dizayni) — faqat SUPERADMIN roli ishlatadi
    location /spd/ {
        alias /usr/share/nginx/html/spd/;
        try_files $uri $uri/ /spd/index.html;
    }

    # Ikkala frontend ham shu bitta Spring Boot backendga ulanadi
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Oddiy foydalanuvchilar frontendi (frontend B dizayni) — root domen
    location / {
        try_files $uri $uri/ /index.html;
    }
}
