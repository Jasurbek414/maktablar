server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # MUHIM (2026-09-18 audit): standart nginx cheklovi 1 MB — o'quvchi rasmi shundan katta
    # bo'lsa 413 (Request Entity Too Large) qaytarardi, holbuki backend (FileController)
    # 10 MB'gacha ruxsat beradi. Endi ikkalasi mos.
    client_max_body_size 12m;

    # Vite build fayllari nomida content-hash bor (masalan index-BdupSWZ7.js) — build
    # o'zgarsa fayl NOMI ham o'zgaradi, shuning uchun bu fayllarni CHEKSIZ keshlash
    # xavfsiz (Cloudflare/brauzer eski nomni emas, doim to'g'ri nomni so'raydi).
    location ~* ^/(assets|spd/assets)/.*\.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html'ni ESA HECH QACHON keshlab bo'lmaydi — aks holda u eski (endi
    # mavjud bo'lmagan) JS fayl nomiga ishora qilib qoladi va Cloudflare/brauzer
    # yangi deploy qilingan kodni hech qachon ko'rsatmaydi (aynan shu muammo yuz berdi).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /spd/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Mobil ilova APK'sini yuklab olish havolasi — ./downloads volume orqali bog'langan,
    # yangi APK qo'yilganda konteynerni qayta qurish SHART EMAS.
    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Disposition "attachment" always;
    }

    # Superadmin panel (frontend A dizayni) — faqat SUPERADMIN roli ishlatadi
    location /spd/ {
        alias /usr/share/nginx/html/spd/;
        try_files $uri $uri/ /spd/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Ikkala frontend ham shu bitta Spring Boot backendga ulanadi
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MUHIM (2026-09-18 audit): standart 60s — DeviceDiscoveryService'ning qurilma
        # qidiruvi (router LAN'i skanerlash) SCAN_DEADLINE=75s gacha davom etishi mumkin,
        # standart chegarada nginx 504 (Gateway Timeout) qaytarardi, garchi backend hali
        # ishlab turgan bo'lsa ham.
        proxy_read_timeout 120s;
    }

    # Oddiy foydalanuvchilar frontendi (frontend B dizayni) — root domen
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
